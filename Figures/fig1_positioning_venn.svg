<svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>ALPS positioning: verifiable, contamination-free, and construction-requiring</title>
<desc>Three overlapping circles for exactly-verifiable, contamination-free, and requires-construction. Reference sets sit in verifiable only; open discovery in contamination-free and construction; static proof sets in verifiable and construction. ALPS alone is in the center of all three.</desc>

<text x="30" y="30" font-size="15.5" font-weight="700" fill="#1a1a1a">Every prior approach has two of three. ALPS is the first with all three.</text>

<!-- circles: use fill-opacity so the rings stay crisp -->
<circle cx="285" cy="235" r="150" fill="#2f6fed" fill-opacity="0.08" stroke="#2f6fed" stroke-width="1.8"/>
<circle cx="455" cy="235" r="150" fill="#7a3fd0" fill-opacity="0.08" stroke="#7a3fd0" stroke-width="1.8"/>
<circle cx="370" cy="380" r="150" fill="#2f9d5f" fill-opacity="0.08" stroke="#2f9d5f" stroke-width="1.8"/>

<!-- circle titles -->
<text x="150" y="112" font-size="13.5" font-weight="700" fill="#2f6fed" text-anchor="middle">Exactly</text>
<text x="150" y="130" font-size="13.5" font-weight="700" fill="#2f6fed" text-anchor="middle">verifiable</text>
<text x="150" y="148" font-size="10" fill="#666666" text-anchor="middle">machine-checked</text>

<text x="592" y="112" font-size="13.5" font-weight="700" fill="#7a3fd0" text-anchor="middle">Contamination-</text>
<text x="592" y="130" font-size="13.5" font-weight="700" fill="#7a3fd0" text-anchor="middle">free</text>
<text x="592" y="148" font-size="10" fill="#666666" text-anchor="middle">no memorizable answers</text>

<text x="370" y="520" font-size="13.5" font-weight="700" fill="#2f9d5f" text-anchor="middle">Requires construction</text>
<text x="370" y="538" font-size="10" fill="#666666" text-anchor="middle">build it, don't retrieve it</text>

<!-- example regions (each missing one property) -->
<text x="175" y="228" font-size="11.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">Reference sets</text>
<text x="175" y="245" font-size="10" fill="#666666" text-anchor="middle">MATH, code, ETP</text>

<text x="560" y="330" font-size="11.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">Open discovery</text>
<text x="560" y="347" font-size="10" fill="#666666" text-anchor="middle">hypotheses, molecules</text>

<text x="188" y="368" font-size="11.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">Static proof sets</text>
<text x="188" y="385" font-size="10" fill="#666666" text-anchor="middle">miniF2F</text>

<!-- center: ALPS -->
<text x="370" y="258" font-size="19" font-weight="800" fill="#111111" text-anchor="middle">ALPS</text>
<text x="370" y="278" font-size="10.5" fill="#555555" text-anchor="middle">all three at once</text>
</svg>
